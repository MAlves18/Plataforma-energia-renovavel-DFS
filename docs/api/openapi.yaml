openapi: "3.0.3"

info:
  title: API Plataforma de Vulnerabilidade Social Energética
  description: >
    API REST da plataforma de análise multicritério de vulnerabilidade
    social energética utilizando o método TOPSIS.
  version: "1.1.0"

servers:
  - url: http://localhost:3000/api
    description: Ambiente local

tags:
  - name: Municípios
    description: Gerenciamento dos municípios analisados
  - name: Critérios
    description: Critérios utilizados na análise multicritério
  - name: TOPSIS
    description: Execução do método TOPSIS
  - name: Simulações
    description: Histórico das análises realizadas
  - name: Relatórios
    description: Exportação dos resultados

paths:

  /municipios:
    get:
      tags:
        - Municípios
      summary: Lista os municípios
      description: Retorna os municípios cadastrados para análise.
      responses:
        "200":
          description: Lista de municípios retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Municipio"

    post:
      tags:
        - Municípios
      summary: Cadastra um município
      description: Adiciona um novo município à plataforma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovoMunicipio"
      responses:
        "201":
          description: Município criado com sucesso
        "400":
          description: Dados inválidos

  /criterios:
    get:
      tags:
        - Critérios
      summary: Lista os critérios
      description: Retorna os critérios utilizados pelo método TOPSIS.
      responses:
        "200":
          description: Lista de critérios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Criterio"

  /topsis/execute:
    post:
      tags:
        - TOPSIS
      summary: Executa análise TOPSIS
      description: >
        Executa o método TOPSIS utilizando os municípios, indicadores
        e pesos informados. O resultado é ordenado pelo coeficiente de
        proximidade Ci.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                weights:
                  type: array
                  description: Pesos dos critérios C1 a C7
                  minItems: 7
                  maxItems: 7
                  items:
                    type: number
                    minimum: 0
                  example:
                    - 0.20
                    - 0.10
                    - 0.15
                    - 0.10
                    - 0.15
                    - 0.20
                    - 0.10
      responses:
        "200":
          description: Ranking TOPSIS gerado com sucesso
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Pesos ou parâmetros inválidos
        "500":
          description: Erro durante o processamento TOPSIS

  /simulacoes:
    get:
      tags:
        - Simulações
      summary: Lista o histórico de simulações
      description: Retorna as simulações TOPSIS armazenadas no banco.
      responses:
        "200":
          description: Histórico retornado com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /relatorios/latest.csv:
    get:
      tags:
        - Relatórios
      summary: Exporta a última simulação em CSV
      description: >
        Gera um arquivo CSV contendo o ranking da última execução
        do método TOPSIS.
      responses:
        "200":
          description: Arquivo CSV gerado com sucesso
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "404":
          description: Nenhuma simulação encontrada

components:

  schemas:

    Municipio:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Salvador
        latitude:
          type: number
          format: double
          example: -12.9714
        longitude:
          type: number
          format: double
          example: -38.5014

    NovoMunicipio:
      type: object
      required:
        - nome
        - latitude
        - longitude
      properties:
        nome:
          type: string
          example: Salvador
        latitude:
          type: number
          format: double
          example: -12.9714
        longitude:
          type: number
          format: double
          example: -38.5014

    Criterio:
      type: object
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: C1
        nome:
          type: string
          example: Percentual de domicílios sem acesso à eletricidade
        tipo:
          type: string
          enum:
            - custo
            - beneficio
          example: beneficio
        peso:
          type: number
          format: double
          example: 0.20