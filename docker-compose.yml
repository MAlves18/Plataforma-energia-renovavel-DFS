services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: energia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energia"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/energia
      JWT_SECRET: desenvolvimento-academico
    volumes:
      - ./docs:/docs:ro
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
  frontend_node_modules:
